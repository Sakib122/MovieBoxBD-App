plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.movieboxbd.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.movieboxbd.app"
        /* minSdk 21 (Android 5.0+) — পুরনো ফোনগুলোও (Samsung/Vivo/Oppo/Realme…) অ্যাপটা
           ইনস্টল করতে পারবে; Media3/ExoPlayer-ও 21 থেকেই চলে */
        minSdk 21
        targetSdk 34
        /* 🏷️ ভার্সন — GitHub Actions এ "Run workflow"-তে ইনপুট দিলে সেটাই ব্যবহার হয় */
        versionCode = (project.findProperty("appVersionCode") ?: "27").toString().toInteger()
        versionName = (project.findProperty("appVersionName") ?: "5.1").toString()
    }

    /* 🔐 স্থায়ী সাইনিং — আগে প্রতি বিল্ডে এলোমেলো ডিবাগ-কি লাগত, তাই
        পুরনো ভার্সনের ওপর আপডেট বসালে "App not installed" দেখাত।
        এবার থেকে সব বিল্ড এই একই কি দিয়ে সাইন হবে — যে-ভার্সন থেকেই
        সরাসরি আপডেট চলবে। কেস্টোরটা রিপোর keystore/ ফোল্ডারে আছে —
        কখনো হারাবে না / বদলাবে না! */
    signingConfigs {
        moviebox {
            storeFile rootProject.file("keystore/movieboxbd.keystore")
            storePassword "MovieBoxBD2026"
            keyAlias "movieboxbd"
            keyPassword "MovieBoxBD2026"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.moviebox
        }
        debug {
            signingConfig signingConfigs.moviebox
        }
    }
    /* 📊 আপডেট-চেকার BuildConfig.VERSION_CODE পড়ে — এই সুইচ ছাড়া জেনারেট হয় না */
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.work:work-runtime:2.9.0'
}
