plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.movieboxbd.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.movieboxbd.app"
        /* minSdk 21 (Android 5.0+) — পুরনো ফোনগুলোও (Samsung/Vivo/Oppo/Realme…) অ্যাপটা
           ইনস্টল করতে পারবে; Media3/ExoPlayer-ও 21 থেকেই চলে */
        minSdk 21
        targetSdk 34
        versionCode 9
        versionName "2.7"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    /* 📊 আপডেট-চেকার BuildConfig.VERSION_CODE পড়ে — এই সুইচ ছাড়া জেনারেট হয় না */
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.work:work-runtime:2.9.0'
}
