name: Build APK

# 🔒 বিল্ড শুধুমাত্র ম্যানুয়ালি: Actions ট্যাব → Build APK → Run workflow
# ফাইল আপলোড/কমিট দিলে আর অটোমেটিক বিল্ড হবে না।
on:
  workflow_dispatch:
    inputs:
      version:
        description: '🏷️ ভার্সন নম্বর (যেমন: 4.3) — বদলাতে না চাইলে এমনিই ঠিক'
        required: false
        default: '4.3'


permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: কোড নামাও
        uses: actions/checkout@v4

      - name: Java 17 সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle সেটআপ
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 🔑 কেস্টোর-চেক (এটা ছাড়া সব বিল্ড ভিন্ন কি-তে সাইন হবে!)
        run: |
          if [ ! -f keystore/movieboxbd.keystore ]; then
            echo "❌ keystore/movieboxbd.keystore রিপোতে নেই!"
            echo "   zip-এর keystore/ ফোল্ডারটাও GitHub-এ আপলোড/কমিট করো —"
            echo "   ওই ফাইল ছাড়া বিল্ড হলে আপডেট ইনস্টল হবে না (package conflicts)।"
            exit 1
          fi
          echo "✅ কেস্টোর আছে — স্থায়ী কি-তে সাইন হবে"

      - name: APK বিল্ড
        run: gradle assembleDebug --no-daemon -PappVersionName=${{ github.event.inputs.version }}

      - name: APK রেডি করো
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/MovieBoxBD.apk
          ls -la out/

      - name: 🔍 সাইনিং-কি যাচাই (স্থায়ী-কি না হলে রিলিজ হবেই না!)
        run: |
          FP=$(keytool -printcert -jarfile out/MovieBoxBD.apk | grep -o "SHA256: [0-9A-F:]*" | head -1 | sed 's/SHA256: //')
          echo "APK-র কি: $FP"
          if [ "$FP" != "0A:94:A4:1C:F3:3D:BC:E6:01:41:9D:E6:B9:86:EB:A2:41:E1:CF:67:60:D4:96:FF:58:CC:95:2D:2C:C1:93:A5" ]; then
            echo "❌ স্থায়ী-কি নয় — এই APK রিলিজ করা যাবে না!"
            echo "   কারণ: app/build.gradle-এ signingConfigs ব্লক নেই বা বদলে গেছে।"
            echo "   ঠিক build.gradle (সাইনিং-ব্লকসহ) রিপোতে বসাও, তারপর আবার Run করো।"
            exit 1
          fi
          echo "✅ স্থায়ী-কি নিশ্চিত — এই বিল্ড সব আপডেটের ওপর সরাসরি বসবে"

      - name: Release-এ APK তুলো
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MovieBoxBD v${{ github.event.inputs.version }} APK (build ${{ github.run_number }})
          files: out/MovieBoxBD.apk
          body: |
            📱 MovieBoxBD v${{ github.event.inputs.version }} — নতুন APK তৈরি হয়েছে!
            নিচের MovieBoxBD.apk ডাউনলোড করে ইনস্টল করো।
          make_latest: true
